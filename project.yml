name: StaiN
options:
  bundleIdPrefix: io.github.fbonnemaison
  developmentLanguage: es
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MARKETING_VERSION: "0.9.2"
    CURRENT_PROJECT_VERSION: "38"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
packages:
  StainKit:
    path: Packages/StainKit
targets:
  StaiN:
    type: application
    platform: macOS
    sources:
      - StaiN
      # El texto de la licencia viaja dentro de la app, como pide la MIT.
      - path: LICENSE
        buildPhase: resources
    dependencies:
      - package: StainKit
    info:
      path: StaiN/Resources/Info.plist
      properties:
        CFBundleDocumentTypes:
          - { CFBundleTypeName: "Imagen PNG", CFBundleTypeRole: Editor, LSHandlerRank: Alternate, LSItemContentTypes: [public.png] }
          - { CFBundleTypeName: "Imagen JPEG", CFBundleTypeRole: Editor, LSHandlerRank: Alternate, LSItemContentTypes: [public.jpeg] }
          - { CFBundleTypeName: "Imagen BMP", CFBundleTypeRole: Editor, LSHandlerRank: Alternate, LSItemContentTypes: [com.microsoft.bmp] }
          - { CFBundleTypeName: "Imagen GIF", CFBundleTypeRole: Editor, LSHandlerRank: Alternate, LSItemContentTypes: [com.compuserve.gif] }
          - { CFBundleTypeName: "Imagen TIFF", CFBundleTypeRole: Editor, LSHandlerRank: Alternate, LSItemContentTypes: [public.tiff] }
          - { CFBundleTypeName: "Imagen HEIC", CFBundleTypeRole: Editor, LSHandlerRank: Alternate, LSItemContentTypes: [public.heic] }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fbonnemaison.StaiN
        PRODUCT_NAME: StaiN
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StaiN
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 App-Zilla. Licencia MIT."
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        # Guardar directamente desde el título de la ventana en Imágenes y Descargas.
        ENABLE_FILE_ACCESS_PICTURE_FOLDER: readwrite
        ENABLE_FILE_ACCESS_DOWNLOADS_FOLDER: readwrite
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_RESOURCE_ACCESS_PRINTING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StaiNUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - StaiNUITests
    dependencies:
      - target: StaiN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.fbonnemaison.StaiNUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StaiN
schemes:
  StaiN:
    build:
      targets:
        StaiN: all
        StaiNUITests: [test]
    test:
      targets:
        - StaiNUITests
